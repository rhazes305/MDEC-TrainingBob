<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KPI Dashboard - Log Masuk</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">📊</div>
        <h1>Sistem KPI</h1>
        <p>Sistem Penilaian Prestasi Organisasi</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Nama Pengguna</label>
          <input type="text" id="username" placeholder="Masukkan nama pengguna" required />
        </div>
        <div class="form-group">
          <label for="password">Kata Laluan</label>
          <input type="password" id="password" placeholder="Masukkan kata laluan" required />
        </div>
        <div class="form-group">
          <label for="role">Peranan</label>
          <select id="role" required>
            <option value="">-- Pilih Peranan --</option>
            <option value="admin">Admin / OD</option>
            <option value="pengguna">Pengguna</option>
            <option value="pengurusan">Pengurusan</option>
          </select>
        </div>
        <button type="submit" class="btn-login">Log Masuk</button>
      </form>

      <div class="login-hint">
        <p>Demo akaun:</p>
        <span>Admin: <b>admin / admin123</b></span><br/>
        <span>Pengguna: <b>user / user123</b></span><br/>
        <span>Pengurusan: <b>mgmt / mgmt123</b></span>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const r = document.getElementById('role').value;
      const accounts = {
        admin: { user: 'admin', pass: 'admin123', page: 'admin.html' },
        pengguna: { user: 'user', pass: 'user123', page: 'pengguna.html' },
        pengurusan: { user: 'mgmt', pass: 'mgmt123', page: 'pengurusan.html' }
      };
      const acc = accounts[r];
      if (acc && u === acc.user && p === acc.pass) {
        localStorage.setItem('kpi_role', r);
        localStorage.setItem('kpi_user', u);
        window.location.href = acc.page;
      } else {
        alert('Nama pengguna, kata laluan atau peranan tidak betul.');
      }
    }
  </script>
</body>
</html>
